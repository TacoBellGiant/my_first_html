<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Introduction - OOP</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #6a11cb, #2575fc);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.2);
      text-align: center;
      width: 420px;
    }

    h1 {
      color: #333;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #2575fc;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      background: #1259c3;
    }

    .output {
      margin-top: 20px;
      font-size: 18px;
      color: #222;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Robot Introduction using OOP</h1>

  <button onclick="showRobotInfo()">Introduce Robot</button>

  <div class="output" id="robotOutput"></div>
</div>

<script>
  // OOP Concept: Class and Object
  class Robot {
    constructor(name, model, purpose) {
      this.name = name;
      this.model = model;
      this.purpose = purpose;
    }

    introduce() {
      return `
        Hello! My name is ${this.name}. <br>
        My model is ${this.model}. <br>
        My purpose is ${this.purpose}. 🤖
      `;
    }
  }

  // Creating Object
  const myRobot = new Robot(
    "RoboX",
    "RX-2026",
    "helping humans with technology"
  );

  // Function to display robot introduction
  function showRobotInfo() {
    document.getElementById("robotOutput").innerHTML =
      myRobot.introduce();
  }
</script>

</body>
</html>
